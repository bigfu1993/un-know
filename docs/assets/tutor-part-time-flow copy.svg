      .line.negative { stroke: #d93025; marker-end: url(#arrow-negative); }
      .return { fill: none; stroke: #222; stroke-width: 2.4; stroke-dasharray: 7 7; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow); }
      .text { fill: #444; font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; font-size: 20px; text-anchor: middle; dominant-baseline: middle; }
      .small { fill: #555; font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; font-size: 20px; text-anchor: middle; dominant-baseline: middle; }
      .tag { fill: #555; font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; font-size: 20px; dominant-baseline: middle; }
